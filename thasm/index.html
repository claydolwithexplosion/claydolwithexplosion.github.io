---
layout: base
title: Thumb Assembler
---

<style>
:root {
	--bg:#222;
	--fg:#ddd;
	--gutter-bg:#282828;
	--gutter-fg:#777;
	--sel:#69e5;
	--err-bg:#f443;
	--err-line:#e33;
	--mnemonic:#6c6;
	--number:#63c;
	--register:#c36;
	--label:#cc8;
	--operator:#00f;
	--comment:#666;
}

.wrapper {
	max-width: 100%;
}

#workspace {
	display: flex;
	flex-direction: row;
	gap: 8px;
	height: 100vh;
	height: 100dvh;
}

#output {
	flex: 1 1 50%;
	min-width: 0;
	min-height: 0;
	display: flex;
	flex-direction: column;
	height:60vh;
	border: 1px solid #8884;
	background: var(--bg);
	color: var(--fg);
	font: inherit;
}
#out {
	flex: 1;
	overflow: auto;
}

@media (max-aspect-ratio: 1/1) {
	#workspace {
		flex-direction: column;
	}
}

#editor {
	flex: 1 1 50%;
	min-width: 0;
	min-height: 0;
	display:flex;
	flex-direction: column;
	height:60vh;
	border:1px solid #8884;
	background:var(--bg);
	color:var(--fg);
	font:14px/1.45 Consolas, "Courier New", monospace;
	tab-size:8;
}
#editor:focus-within {
	border-color:#59d;
}

#editor-top {
	flex:1;
	display:flex;
	flex-direction:row;
}
#gutter {
	overflow:hidden;
	user-select:none; text-align:right;
	padding:4px 6px 4px 8px;
	min-width:1.5em;
	background:var(--gutter-bg); color:var(--gutter-fg);
	border-right:1px solid #8882;
}
#gutter .err {
	color:var(--err-line); font-weight:bold;
}
#stack {
	position:relative; flex:1;
}

#view, #source {
	position:absolute;
	inset:0;
	margin:0;
	border:0;
	padding:4px 8px;
	font:inherit;
	line-height:inherit;
	tab-size:inherit;
	white-space:pre;
}
#view {
	overflow:hidden; pointer-events:none;
}
#code {
	font:inherit;
}
#source {
	resize:none; outline:none;
	background:transparent;
	color:transparent;
	-webkit-text-fill-color:transparent;
	caret-color:var(--fg);
}
#source::selection {
	background:var(--sel);
	color:transparent;
}

.ln-err {
	background:var(--err-bg); text-decoration:underline wavy var(--err-line);
}

#status {
	display: flex;
	flex-direction: row;
	font:12px Consolas, monospace; padding:4px 8px; color:var(--gutter-fg);
}
#pos {
	flex: 1;
}

.tok-mnemonic{color:var(--mnemonic)}
.tok-int_literal{color:var(--number)}
.tok-register{color:var(--register)}
.tok-label{color:var(--label)}
.tok-operator{color:var(--operator)}
.tok-comment{color:var(--comment)}

</style>
<h2>Thumb assembler</h2>
<script src="assemble.js"></script>
<div id="workspace">
	<div id="editor">
		<div id="editor-top">
			<div id="gutter"></div>
			<div id="stack">
				<pre id="view"><code id="code"></code></pre>
				<textarea id="source" spellcheck="false" autocomplete="off" autocapitalize="off" wrap="off"></textarea>
			</div>
		</div>
		<div id="status">
			<span id="pos">Line 1, Column 1</span>&nbsp;
			<button onclick="assemble()">Assemble</button>
		</div>
	</div>
	<div id="output">
		<pre id="out"></pre>
	</div>
</div>
<script src="code.js"></script>
